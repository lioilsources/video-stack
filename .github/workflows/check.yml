name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  catalog:
    name: Scény a příběhy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # chain.py počítá snímky koster přes ffprobe
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Syntaxe
        run: python -m py_compile chain.py serve.py tools/*.py
      - name: Scény
        run: python tools/check_scenes.py
      - name: Příběhy
        run: python tools/check_stories.py
